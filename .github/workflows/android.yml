# Baut bei jedem Push eine debug-APK.
# Fester Download-Link (immer die neueste Version, kein ZIP, kein Actions-Klicken):
#   https://github.com/Vanacho1202/monsterdeals/releases/latest/download/app-debug.apk
# Alternativ über Artifacts: GitHub -> Actions -> letzter Lauf -> Artifacts -> app-debug
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # nötig, damit der Job den "latest"-Release aktualisieren darf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 versucht neuerdings (seit einem
      # Runner-Image-Update) unnötige Extra-Pakete (TV/XR/ARM-Emulator) zu
      # installieren und bleibt dabei an einer interaktiven Lizenz-Abfrage
      # hängen (CI hat kein stdin -> Build bricht ab, bevor überhaupt
      # gebaut wird). ubuntu-latest hat die Android-SDK-Kommandozeilentools
      # bereits vorinstalliert; es fehlt nur die Lizenz-Zustimmung für
      # Gradle/AGP, um fehlende Pakete (Platform/Build-Tools) selbst
      # nachzuladen - das reicht und ist stabiler als die Action.
      - name: Android-SDK-Lizenzen akzeptieren (ohne interaktive Abfrage)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e4" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Gradle-Wrapper ausführbar machen
        run: chmod +x ./gradlew

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Als "latest"-Release veröffentlichen (fester Download-Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neuester Debug-Build
          body: |
            Automatisch gebaut aus Commit ${{ github.sha }}.
            Vor dem Installieren ggf. erst die alte Version deinstallieren -
            jeder Build hat einen neuen Debug-Signierschlüssel.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
