# Baut bei jedem Push eine debug-APK und legt sie als Artifact ab.
# Herunterladen: GitHub -> Actions -> letzter Lauf -> Artifacts -> app-debug
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Gradle-Wrapper ausfuehrbar machen
        run: chmod +x ./gradlew

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
